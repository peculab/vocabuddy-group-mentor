<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f766e"><title>國三英文・中文答英文</title>
<style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f4f6f5;color:#203c39;padding:24px;text-align:center}main{max-width:520px;margin:auto}h1,a{color:#0f766e}p,details{line-height:1.7}#card{margin:24px auto;padding:36px 24px;background:white;border-radius:14px;box-shadow:0 4px 16px #0001;font-size:2rem}input,textarea,select{font:inherit;padding:12px;border:1px solid #94aaa6;border-radius:8px;max-width:100%}input,textarea{width:100%;margin-top:8px}input{font-size:1.25rem}button{margin:8px 4px;padding:12px 20px;font:inherit;border:0;border-radius:8px;background:#0f766e;color:white;cursor:pointer}.ghost{background:white;color:#0f766e;border:1px solid #0f766e}.warn{background:#a43434}#meaning{min-height:3em}#stats,#quiz{color:#596b68}#importBox,details{text-align:left;margin-top:24px}textarea{height:140px}.err{color:#a43434}:focus-visible{outline:3px solid #a7ddd4;outline-offset:3px}</style></head>
<body><main><h1>國三英文・中文答英文</h1>
<p>看中文，輸入英文單字或片語。<br>按 Enter 檢查答案，再按一次換下一題。</p>
<label for="unit">練習範圍：</label><select id="unit" onchange="changeUnit()"><option value="all">康軒三上・全部精選</option><option value="1">三上 Unit 1</option><option value="2">三上 Unit 2</option><option value="3">三上 Unit 3</option><option value="4">三上 Unit 4</option><option value="5">三上 Unit 5</option><option value="6">三上 Unit 6</option><option value="custom">自訂匯入單字</option></select>
<p id="stats" aria-live="polite"></p><div id="card">—</div>
<form onsubmit="event.preventDefault(); submitAnswer()"><label for="answer">英文答案</label>
<input id="answer" lang="en" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="輸入英文單字或片語" aria-describedby="meaning">
<button id="submit" type="submit">檢查答案</button><button id="reveal" type="button" class="ghost" onclick="reveal()">不會，查看答案</button><button id="continue" type="button" onclick="advance()" hidden>下一題 →</button></form>
<p id="meaning" role="status" aria-live="polite"></p><button class="ghost" onclick="smartQuiz()">重練錯字</button><p id="quiz" role="status"></p>
<details><summary>字庫範圍與答題方式</summary><p>康軒版 114 學年三上（第五冊）各課精選，共 35 字，非完整課本字表；三下字庫待補。課次參考均一的適康軒版課程索引，中文提示另行編寫。不同學年的內容可能有差異。</p>
<p><a href="https://www.junyiacademy.org/topics/k-j-114-vocab-b5-u1" target="_blank" rel="noopener">查看課程參考</a></p><p>請填寫本課對應的單字；忽略大小寫及多餘空白，拼字需正確。答錯或查看答案後，該字會排到隊尾重練。學習紀錄儲存在此瀏覽器。</p></details>
<button class="ghost" onclick="toggleImport()">匯入課本單字</button><div id="importBox" hidden><label for="csv">每行填入英文,中文</label><textarea id="csv" placeholder="en,zh&#10;apple,蘋果&#10;give up,放棄"></textarea><button onclick="importCSV()">匯入</button><button class="warn" onclick="clearImported()">清除匯入</button><div id="importMsg" role="status"></div></div></main>
<script src="words.js"></script><script src="srs.js"></script><script src="csv.js"></script><script src="answer.js"></script>
<script>
const $=id=>document.getElementById(id), LOG_KEY='vb-log-zh-en-kangxuan';
function read(key,fallback){try{return JSON.parse(localStorage.getItem(key))||fallback;}catch{return fallback;}}
function write(key,value){try{localStorage.setItem(key,JSON.stringify(value));}catch{}}
let log=read(LOG_KEY,{});if(typeof log!=='object'||Array.isArray(log))log={};
const today=()=>Math.floor(Date.now()/864e5);
function stateOf(w){return log[w.en]||(log[w.en]={seen:0,wrong:0,box:1,due:today()});}
function loadCustom(){const list=read('vb-words',[]);return Array.isArray(list)?list:[];}
const baseWords=[...WORDS];
const custom=loadCustom().filter(w=>w&&typeof w.en==='string'&&typeof w.zh==='string');
WORDS.push(...validateWords(custom.map((w,i)=>({line:i+1,fields:[w.en.trim().toLowerCase(),w.zh.trim()]})),WORDS).ok);
const selectedWords=()=>WORDS.filter(w=>$('unit').value==='all'?!!w.unit:$('unit').value==='custom'?!w.unit:w.unit===Number($('unit').value));
let queue=selectedWords().filter(w=>stateOf(w).due<=today()),cur=null,result=null;
function stats(){$('stats').textContent='本範圍 '+selectedWords().length+' 字｜今日剩 '+queue.length+' 題';}
function changeUnit(){queue=selectedWords().filter(w=>stateOf(w).due<=today());$('quiz').textContent='';next();}
function next(){
 result=null;cur=queue[0]||null;$('meaning').textContent='';$('answer').value='';$('answer').disabled=!cur;
 $('submit').hidden=$('reveal').hidden=!cur;$('continue').hidden=true;
 $('card').textContent=cur?cur.zh:'本範圍今日練習完成！可切換課次或重練錯字。';stats();if(cur)$('answer').focus();
}
function showResult(ok,skipped){
 if(!cur||result!==null)return;result=ok;
 $('meaning').textContent=ok?'答對了！'+cur.en:(skipped?'參考答案：':'再記一次，正確答案：')+cur.en+'。稍後會再練習。';
 $('answer').disabled=true;$('submit').hidden=$('reveal').hidden=true;$('continue').hidden=false;
 const s=stateOf(cur);s.seen++;if(!ok)s.wrong++;Object.assign(s,schedule(s.box,ok,today()));write(LOG_KEY,log);$('continue').focus();
}
function submitAnswer(){
 if(!cur)return;if(result!==null)return advance();
 if(!$('answer').value.trim()){$('meaning').textContent='請先輸入英文，或按「不會，查看答案」。';$('answer').focus();return;}
 showResult(isCorrectAnswer($('answer').value,cur.en),false);
}
function reveal(){showResult(false,true);}
function advance(){if(result===null)return;const word=queue.shift();if(!result)queue.push(word);next();}
function smartQuiz(){
 const weak=selectedWords().filter(w=>stateOf(w).wrong>0).sort((a,b)=>stateOf(b).wrong/stateOf(b).seen-stateOf(a).wrong/stateOf(a).seen);
 if(!weak.length){$('quiz').textContent='這個範圍還沒有錯字紀錄，先完成幾題練習吧！';return;}
 queue=weak;$('quiz').textContent='正在重練本範圍的錯字。';next();
}
function toggleImport(){$('importBox').hidden=!$('importBox').hidden;if(!$('importBox').hidden)$('csv').focus();}
function importCSV(){
 const {ok,errors}=validateWords(parseCSV($('csv').value),WORDS);const msg=$('importMsg');msg.textContent='';
 if(ok.length){write('vb-words',WORDS.filter(w=>!w.unit).concat(ok));WORDS.push(...ok);$('unit').value='custom';changeUnit();$('csv').value='';}
 const line=(text,cls)=>{const d=document.createElement('div');d.textContent=text;if(cls)d.className=cls;msg.appendChild(d);};
 line('匯入 '+ok.length+' 個單字');errors.forEach(e=>line('第 '+e.line+' 行：'+e.reason,'err'));
}
function clearImported(){
 if(!loadCustom().length){$('importMsg').textContent='沒有匯入過的單字。';return;}
 if(!confirm('移除匯入的單字？學習紀錄會保留。'))return;
 write('vb-words',[]);WORDS.splice(0,WORDS.length,...baseWords);changeUnit();$('importMsg').textContent='已清除匯入單字。';
}
next();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
